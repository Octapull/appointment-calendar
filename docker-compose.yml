version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: calendar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_NAME=calendar_db
      - DB_PORT=5432
      - PORT=5000
    depends_on:
      - db
    # For development, you might want to uncomment these to enable hot-reloading:
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Vite dev server'in tarayicidan cagiracagi backend adresi
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    # For development, you might want to uncomment these to enable hot-reloading:
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules

volumes:
  pgdata:
